# Checks every push to main and every pull request: lint, types, unit tests, build,
# publication checks, and browser tests. Nothing is published here: the npm package and
# the documentation site are published together by release.yml, from a version tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # No Go module in this repository: pre-commit only needs the Go toolchain.
          cache: false
      - run: python -m pip install pre-commit==4.6.2
      - run: npm run check:publication
      # Visual regression snapshots depend on the local Linux Chromium and are checked
      # locally only.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert "reference screenshots"
